name: Duo Max - upstream v0.0.31 baseline

on:
  pull_request:
    paths:
      - ".github/workflows/duomax-v031.yml"
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned upstream and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify upstream v0.0.31 configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Version configuration:"
          grep -E 'versionName|versionCode|compileSdk|targetSdk' app/build.gradle.kts
          echo "Gradle wrapper:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep -q 'versionName = "0.0.31"' app/build.gradle.kts
          grep -q 'versionCode = 31' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'agp = "8.9.2"' gradle/libs.versions.toml
          grep -Fq 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          git submodule status --recursive | tee /tmp/submodule-status
          if grep -Eq '^[-+U]' /tmp/submodule-status; then
            echo "::error::Submodules are missing or not at pinned revisions"
            exit 1
          fi

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager missing"; exit 1; }
          echo "SDK root: $SDK_ROOT"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/ndk/27.0.12077973"

      - name: Build original 0.0.31 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -exec cp {} artifacts/ \;
          (cd artifacts && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          git submodule status --recursive > artifacts/SUBMODULES
          grep -E 'applicationId =|minSdk =|targetSdk =|versionCode =|versionName =|ndkVersion =' app/build.gradle.kts > artifacts/BUILD_PARAMETERS

      - name: Compare upstream release APK with our built APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk-comparison
          ORIGINAL="artifacts/apk-comparison/upstream-v0.0.31.apk"
          curl --fail --location --retry 3 --output "$ORIGINAL" "https://github.com/jqssun/android-airplay-server/releases/download/v0.0.31/app-release.apk"
          OUR_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$OUR_APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT" && test -x "$APKSIGNER"
          for entry in "upstream:$ORIGINAL" "duomax:$OUR_APK"; do
            name="${entry%%:*}"
            apk="${entry#*:}"
            out="artifacts/apk-comparison/$name"
            "$AAPT" dump badging "$apk" > "$out-badging.txt"
            "$AAPT" dump permissions "$apk" > "$out-permissions.txt"
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$out-manifest.txt"
            "$APKSIGNER" verify --print-certs "$apk" > "$out-signature.txt"
            unzip -Z1 "$apk" | sort > "$out-files.txt"
            sha256sum "$apk" > "$out-sha256.txt"
          done
          diff -u artifacts/apk-comparison/upstream-permissions.txt artifacts/apk-comparison/duomax-permissions.txt > artifacts/apk-comparison/permissions.diff || true
          diff -u artifacts/apk-comparison/upstream-files.txt artifacts/apk-comparison/duomax-files.txt > artifacts/apk-comparison/files.diff || true
          {
            echo "# AirPlay Server v0.0.31: upstream vs Duo Max"
            echo
            echo "Original APK: upstream v0.0.31 GitHub release"
            echo "Duo Max APK: current GitHub Actions debug build"
            echo
            echo "## Package identifiers"
            grep '^package:' artifacts/apk-comparison/*-badging.txt || true
            echo
            echo "## Signatures"
            grep -E 'Signer #1 certificate SHA-256 digest:' artifacts/apk-comparison/*-signature.txt || true
            echo
            echo "## Forbidden permissions"
            if grep -E 'android.permission.(INSTALL_PACKAGES|REQUEST_INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES|UPDATE_PACKAGES_WITHOUT_USER_ACTION|ENFORCE_UPDATE_OWNERSHIP|BIND_DEVICE_ADMIN)' artifacts/apk-comparison/*-permissions.txt; then
              echo "Forbidden permission found: inspect output above"
            else
              echo "None of the six forbidden permissions found in either APK"
            fi
            echo
            echo "## Permission differences"
            cat artifacts/apk-comparison/permissions.diff
          } | tee artifacts/apk-comparison/SUMMARY.md
          rm "$ORIGINAL"

      - name: Upload APK and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: duomax-upstream-0.0.31-debug
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
