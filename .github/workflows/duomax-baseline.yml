name: Duo Max baseline debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK dependencies
        run: |
          # GitHub ubuntu-latest already provides Android command-line tools.
          # Avoid setup-android@v3: its sdkmanager 'tools' request fails because
          # the obsolete Android SDK 'tools' package is no longer available.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          echo "Android SDK root: $SDK_ROOT"
          echo "Installed SDK platforms:"
          ls -1 "$SDK_ROOT/platforms" || true
          echo "Available SDK platform 37 packages:"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list | grep -E 'platforms;android-37([[:space:]]|$)' || true
          if [ ! -f "$SDK_ROOT/platforms/android-37/android.jar" ]; then
            if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list | grep -Eq '^[[:space:]]*platforms;android-37[[:space:]]*\\|'; then
              echo "::error::compileSdk 37 is required by the current upstream 0.0.36 source, but platforms;android-37 is not available. Pin the genuine 0.0.31 sources before building; do not silently downgrade SDK."
              exit 1
            fi
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build unsigned-for-release, debug-signed APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Record artifact checksums and build identity
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -exec cp {} artifacts/ \;
          (cd artifacts && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          git submodule status --recursive > artifacts/SUBMODULES
          grep -E 'applicationId =|minSdk =|targetSdk =|versionCode =|versionName =|ndkVersion =' app/build.gradle.kts > artifacts/BUILD_PARAMETERS

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: duomax-debug-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
